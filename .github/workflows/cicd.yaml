name: go-web-app-CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'
      - 'VERSION'

concurrency:
  group: go-web-app
  cancel-in-progress: true

jobs:

  # ------------------------
  # CI STAGE
  # ------------------------
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o go-web-app

      - name: Test
        run: go test -cover ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3

  # ------------------------
  # VERSION + HELM (ATOMIC)
  # ------------------------
  release:
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      new_version: ${{ steps.version.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Ensure VERSION file exists
        run: |
          if [ ! -f VERSION ]; then
            echo "1.0.0" > VERSION
          fi

      - name: Increment version
        id: version
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((10#$PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          echo "$NEW_VERSION" > VERSION
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Ensure Helm values.yaml exists
        run: |
          if [ ! -f helm/go-web-app-chart/values.yaml ]; then
            echo "tag: 1.0.0" > helm/go-web-app-chart/values.yaml
          fi

      - name: Update Helm chart
        run: |
          sed -i "s/tag: .*/tag: \"${{ steps.version.outputs.new_version }}\"/" helm/go-web-app-chart/values.yaml

      - name: Commit VERSION + Helm (atomic)
        run: |
          git config --global user.email "your-email@example.com"
          git config --global user.name "your-name"

          git add VERSION helm/go-web-app-chart/values.yaml
          git commit -m "Release version ${{ steps.version.outputs.new_version }}" || echo "No changes"

          git pull --rebase origin main
          git push origin main

      - name: Create Git tag
        run: |
          git tag v${{ steps.version.outputs.new_version }}
          git push origin v${{ steps.version.outputs.new_version }}

  # ------------------------
  # DOCKER BUILD & PUSH
  # ------------------------
  docker:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${{ needs.release.outputs.new_version }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:$VERSION .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:$VERSION ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:latest

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:$VERSION
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:latest
