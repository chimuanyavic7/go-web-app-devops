name: go-web-app-CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'
      - 'VERSION'

concurrency:
  group: go-web-app
  cancel-in-progress: true

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      # ------------------------
      # BUILD & TEST
      # ------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o go-web-app

      - name: Test
        run: go test ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3

      # ------------------------
      # VERSIONING (SINGLE SOURCE OF TRUTH)
      # ------------------------
      - name: Ensure VERSION file exists
        run: |
          if [ ! -f VERSION ]; then
            echo "1.0.0" > VERSION
          fi

      - name: Increment version
        id: version
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((10#$PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          echo "$NEW_VERSION" > VERSION
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # ------------------------
      # UPDATE HELM FIRST
      # ------------------------
      - name: Ensure Helm values.yaml exists
        run: |
          if [ ! -f helm/go-web-app-chart/values.yaml ]; then
            echo "tag: 1.0.0" > helm/go-web-app-chart/values.yaml
          fi

      - name: Update Helm chart
        run: |
          echo "Updating Helm tag to $NEW_VERSION"
          sed -i "s/tag: .*/tag: \"$NEW_VERSION\"/" helm/go-web-app-chart/values.yaml

      # ------------------------
      # COMMIT EVERYTHING ONCE
      # ------------------------
      - name: Commit VERSION + Helm together
        run: |
          git config --global user.email "victoronwuka7@gmail.com"
          git config --global user.name "Chimuanya vic"

          git add VERSION helm/go-web-app-chart/values.yaml
          git commit -m "Release version $NEW_VERSION" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin main

      # ------------------------
      # DOCKER BUILD (AFTER COMMIT)
      # ------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:$NEW_VERSION .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:$NEW_VERSION
