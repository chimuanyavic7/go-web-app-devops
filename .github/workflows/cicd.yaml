name: go-web-app-CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'README.md'
      - 'VERSION'

jobs:

  # ------------------------
  # 1. CI (Build + Test)
  # ------------------------
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
    
      - name: Install dependencies
        run: go mod download

      - name: Build app
        run: go build -o app

      - name: Run tests
        run: go test ./...

      - name: Run lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3


  # ------------------------
  # 2. RELEASE (Version + Helm)
  # ------------------------
  release:
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Create VERSION file if missing
        run: |
          if [ ! -f VERSION ]; then
            echo "1.0.0" > VERSION
          fi

      - name: Increment version
        id: version
        run: |
          CURRENT=$(cat VERSION)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))

          NEW="$MAJOR.$MINOR.$PATCH"

          echo "$NEW" > VERSION
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Update Helm tag
        run: |
          sed -i "s/tag: .*/tag: \"${{ steps.version.outputs.version }}\"/" helm/go-web-app-chart/values.yaml

      - name: Commit changes
        run: |
          git config --global user.email "ci-bot@github.com"
          git config --global user.name "github-actions"

          git add VERSION helm/go-web-app-chart/values.yaml
          git commit -m "Release version ${{ steps.version.outputs.version }}" || echo "No changes"
          git push


  # ------------------------
  # 3. DOCKER BUILD & PUSH
  # ------------------------
  docker:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        run: echo "VERSION=${{ needs.release.outputs.version }}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:$VERSION .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:$VERSION