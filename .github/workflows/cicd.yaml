name: go-web-app-CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o go-web-app

      - name: Test
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3

  push:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Ensure VERSION file exists
        run: |
          if [ ! -f VERSION ]; then
            echo "1.0.0" > VERSION
          fi

      - name: Increment version
        id: version
        run: |
          # Read current version
          CURRENT_VERSION=$(cat VERSION)
          echo "Current version: $CURRENT_VERSION"

          # Split into major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Increment PATCH safely
          PATCH=$((10#$PATCH + 1))

          # Construct new version
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          # Save to VERSION file
          echo "$NEW_VERSION" > VERSION

          # Set output for other jobs
          echo "::set-output name=new_version::$NEW_VERSION"

      - name: Commit new VERSION
        run: |
          git config --global user.email "victoronwuka7@gmail.com"
          git config --global user.name "Chimuanya vic"
          git add VERSION
          git commit -m "Bump version to ${{ steps.version.outputs.new_version }}" || echo "No changes to commit"
          git push origin main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ steps.version.outputs.new_version }}

  update-helm:
    runs-on: ubuntu-latest
    needs: push
    env:
      NEW_VERSION: ${{ needs.push.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Ensure Helm values.yaml exists
        run: |
          if [ ! -f helm/go-web-app-chart/values.yaml ]; then
            echo "tag: 1.0.0" > helm/go-web-app-chart/values.yaml
          fi

      - name: Update tag in Helm chart
        run: |
          echo "Updating Helm chart tag to $NEW_VERSION"
          sed -i "s/tag: .*/tag: \"$NEW_VERSION\"/" helm/go-web-app-chart/values.yaml

      - name: Commit Helm chart
        run: |
          git config --global user.email "victoronwuka7@gmail.com"
          git config --global user.name "Chimuanya vic"
          git add helm/go-web-app-chart/values.yaml
          git commit -m "Update Helm chart to $NEW_VERSION" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
